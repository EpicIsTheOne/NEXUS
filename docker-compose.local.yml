services:
  aichat:
    build: .
    container_name: nexus-aichat-local
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3000"
      BASE_PATH: "${BASE_PATH:-/aichat}"
      APP_DATA_DIR: "/app/data"
      PUBLIC_APP_ORIGIN: "${PUBLIC_APP_ORIGIN:-http://localhost:${HOST_PORT:-3000}}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
