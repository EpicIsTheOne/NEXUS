services:
  aichat:
    build: .
    container_name: aichat-mvp
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3000"
      BASE_PATH: "/nexus"
      BACKEND_BASE_URL: "http://100.72.220.117:1234/v1"
      DEFAULT_MODEL: "pkrd/cosmosrp-2.1:it"
      DEFAULT_PROVIDER_LABEL: "llm"
      ST_DATA_DIR: "/mounted/st-data/default-user"
      OPENCLAW_AUTH_PROFILES_PATH: "/openclaw-auth-profiles.json"
      OPENCLAW_BRIDGE_URL: "http://host.docker.internal:3101"
      OPENCLAW_BRIDGE_SECRET: "${OPENCLAW_BRIDGE_SECRET:-}"
    volumes:
      - ../sillytavern-stack/data:/mounted/st-data:ro
      - ./data:/app/data
      - /root/.openclaw/agents/orchestrator/agent/auth-profiles.json:/openclaw-auth-profiles.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    labels:
      com.blobevm.managed: "1"
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.nexus.entrypoints: "websecure"
      traefik.http.routers.nexus.rule: "Host(`${PUBLIC_HOST:-your-domain.example}`) && PathPrefix(`/nexus`)"
      traefik.http.routers.nexus.tls: "true"
      traefik.http.routers.nexus.tls.certresolver: "myresolver"
      traefik.http.services.nexus.loadbalancer.server.port: "3000"
      # Legacy route: send old /aichat* traffic to the app, which 301s to /nexus*.
      traefik.http.routers.nexus-legacy.entrypoints: "websecure"
      traefik.http.routers.nexus-legacy.rule: "Host(`${PUBLIC_HOST:-your-domain.example}`) && PathPrefix(`/aichat`)"
      traefik.http.routers.nexus-legacy.tls: "true"
      traefik.http.routers.nexus-legacy.tls.certresolver: "myresolver"

networks:
  proxy:
    external: true
